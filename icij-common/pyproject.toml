[project]
name = "icij-common"
version = "0.8.4"
description = "Common utils for ICIJ libs"
authors = [
  { name = "Clément Doumouro", email = "cdoumouro@icij.org" },
  { name = "ICIJ", email = "engineering@icij.org" },
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  "aiostream~=0.7.1",
  "pydantic~=2.0",
  "pydantic-settings~=2.8",
]

[project.urls]
Repository = "https://github.com/ICIJ/icij-python"
Issues = "https://github.com/ICIJ/icij-python/issues"

[project.optional-dependencies]
elasticsearch = [
  "elasticsearch[async]>=7.17.9,<10",
  "tenacity~=9.0"
]
elasticsearch-7 = [
  "icij-common[elasticsearch]",
  "elasticsearch[async]>=7,<8",
]
elasticsearch-8 = [
  "icij-common[elasticsearch]",
  "elasticsearch[async]>=8,<9",
]
elasticsearch-9 = [
  "icij-common[elasticsearch]",
  "elasticsearch[async]>=9,<10",
]
fastapi = [
  "fastapi~=0.111"
]
neo4j = [
  "neo4j~=5.0"
]

[tool.uv]
conflicts = [
  [
    { extra = "elasticsearch-7" },
    { extra = "elasticsearch-8" },
    { extra = "elasticsearch-9" },
  ],
]

[tool.poetry.extras]
fastapi = ["fastapi"]
neo4j = ["neo4j"]
elasticsearch = ["elasticsearch", "tenacity"]

[dependency-groups]
dev = [
  "ruff~=0.16.1",
  "pytest~=8.2",
  "pytest-asyncio~=0.21",
  "icij-common[neo4j]"
]

[tool.hatch.build.targets.sdist]
include = ["icij_common"]

[tool.ruff]
extend = "../qa/ruff.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(levelname)s][%(asctime)s.%(msecs)03d][%(name)s]: %(message)s"
markers = [
  "es-8: integration test for es-8",
  "es-9: integration test for es-9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
