name: Test for icij-common

on:
  push:
    branches: [ 'main' ]
  pull_request:
    paths:
      - 'icij-common/**.py'
      - '.github/workflows/tests-common.yml'

jobs:
  lint-icij-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.1
          args: "--version" # skips test by displaying the version
      - name: Check formatting
        run: cd icij-common && ruff format --check
      - name: Lint test
        run: cd icij-common && ruff check

  test-icij-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.24
          python-version: 3.14
          enable-cache: true
      - name: Setup Python project
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Start test services
        run: docker compose up -d --wait --build icij-python-test-neo4j icij-python-test-es-7
      - name: Test ES
        run: curl "http://localhost:9200/"
      - name: Run tests
        run: |
          cd icij-common
          uv run --dev --extra elasticsearch-7 --extra fastapi --extra neo4j --frozen pytest -vvv --cache-clear --show-capture=all -r A tests -m "not es8 and not es9"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
