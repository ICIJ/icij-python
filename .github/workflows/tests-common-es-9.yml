name: Test for icij-common ES 9

on:
  push:
    branches: ['main']
  pull_request:
    paths:
      - 'icij-common/**.py'
      - '.github/workflows/tests-common.yml'

jobs:
  test-icij-es-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.24
          python-version: 3.14
          enable-cache: true
      - name: Setup Python project
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Start test services
        run: docker compose up -d --wait --build icij-python-test-es-9
      - name: Test ES
        run: curl "http://localhost:9200/"
      - name: Run ES9 tests
        run: |
          cd icij-common
          uv run --dev --extra elasticsearch-9 --frozen pytest -vvv --cache-clear --show-capture=all -r A tests -m "es9"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
